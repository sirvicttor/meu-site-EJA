<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de cliques</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="contador">
    <h1>Contador de cliques</h1>
    <p id="valor" aria-live="polite">0</p>
    <div class="botoes">
      <button id="diminuir" type="button">Diminuir</button>
      <button id="adicionar" type="button">Clique aqui!</button>
      <button id="zerar" type="button">Zerar</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
